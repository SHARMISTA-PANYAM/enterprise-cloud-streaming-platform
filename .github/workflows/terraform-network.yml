name: Validate Terraform

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-network.yml"

  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-network.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    name: Network Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Network Terraform Init
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init -backend=false

      - name: Network Terraform Validate
        working-directory: infrastructure/terraform/environments/dev
        run: terraform validate

  state-backend:
    name: State Backend Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: State Backend Terraform Init
        working-directory: infrastructure/terraform/bootstrap/state-backend
        run: terraform init -backend=false

      - name: State Backend Terraform Validate
        working-directory: infrastructure/terraform/bootstrap/state-backend
        run: terraform validate